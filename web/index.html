<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amoeba Sports</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #fff;
            margin-bottom: 30px;
        }
        .sports-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sport-card {
            background-color: #333;
            border-radius: 10px;
            padding: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .sport-card h2 {
            margin-top: 0;
            color: #4CAF50;
        }
        .iframe-container {
            width: 100%;
            height: 200px;
            background-color: #000;
            margin-bottom: 15px;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Prevent interaction in preview */
        }
        .overlay-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Amoeba Sports</h1>

    <div class="sports-container">
        <!-- Hockey -->
        <div class="sport-card">
            <h2>Ice Hockey</h2>
            <div class="iframe-container">
                <a href="/hockey/" class="overlay-link" target="_blank"></a>
                <iframe src="/hockey/" title="Hockey Preview"></iframe>
            </div>
            <a href="/hockey/" class="button" target="_blank">Watch Hockey</a>
        </div>

        <!-- Soccer -->
        <div class="sport-card">
            <h2>Soccer</h2>
            <div class="iframe-container">
                <a href="/soccer/" class="overlay-link" target="_blank"></a>
                <iframe src="/soccer/" title="Soccer Preview"></iframe>
            </div>
            <a href="/soccer/" class="button" target="_blank">Watch Soccer</a>
        </div>

        <!-- Football -->
        <div class="sport-card">
            <h2>American Football</h2>
            <div class="iframe-container">
                <a href="/football/" class="overlay-link" target="_blank"></a>
                <iframe src="/football/" title="Football Preview"></iframe>
            </div>
            <a href="/football/" class="button" target="_blank">Watch Football</a>
        </div>
    </div>
</body>
</html>
